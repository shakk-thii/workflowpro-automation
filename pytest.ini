[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results

markers =
    smoke: critical path, runs on every commit
    regression: full suite, runs nightly
    api: API layer tests
    ui: browser tests
    integration: crosses API and UI
    mobile: needs BrowserStack, runs nightly
